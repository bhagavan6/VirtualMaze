<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="title">
        <h5 class="heading">
            <span style="color: red;text-shadow: 0 2px 2px rgba(0,0,0,0.6);">Student</span>
            <span style="color:white;text-shadow: 0 2px 2px rgba(0,0,0,0.6);">Management</span>
            <span style="color:red;text-shadow: 0 2px 2px rgba(0,0,0,0.6);">System</span>
        </h5>
    </div>
    <div class="dashboard">
    <div class="card">
        <h3>Total Students</h3>
        <p id="totalStudents">0</p>
    </div>

    <div class="card">
        <h3>Average Mark</h3>
        <p id="averageMark">0</p>
    </div>

    <div class="card">
        <h3>Highest Mark</h3>
        <p id="highestMark">0</p>
    </div>

    <div class="card">
        <h3>Lowest Mark</h3>
        <p id="lowestMark">0</p>
    </div>
    </div>
    <div class="formSection">
        <div class="formTitle">
        <h3>Enter the Student Details</h3>
    </div>
    <div class="formGroup">
        <label for="studentName">Name</label>
        <input type="text" id="studentName">
        <small class="error" id="nameError"></small>
    </div>

    <div class="formGroup">
        <label for="studentEmail">Email</label>
        <input type="email" id="studentEmail">
        <small class="error" id="mailError"></small>
    </div>
    
    <div class="formGroup">
        <label for="studentAge">Age</label>
        <input type="number" id="studentAge">
        <small class="error" id="ageError"></small>
    </div>

    <div class="formGroup">
        <label for="studentDepartment">Department</label>
        <select id="studentDepartment">
            <option value="" disabled selected>--Select the Department--</option>
            <option value="AI&DS">AI&DS</option>
            <option value="CSE">CSE</option>
            <option value="IT">IT</option>
            <option value="ECE">ECE</option>
            <option value="EEE">EEE</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
            <option value="Others">Others</option>
        </select>
        <input type="text" id="otherDepartment" placeholder="Enter the department name" style="display: none;">
        <small class="error" id="departmentError"></small>
    </div>

    <div class="formGroup">
        <label for="studentMark">Mark</label>
        <input id="studentMark" type="number" min="0" max="100" step="1" placeholder="0-100">
        <small class="error" id="markError"></small>
    </div>
    <button id="addStudent" type="button">Add Student</button>
    </div>
    <button type="button" id="searchButton">Search Student</button>
    <div id="searchBar" class="hidden">
    <div class="searchSection">
        <input type="text" id="searchInput" placeholder="Search by name, email or department">
    </div>
    <table id="studentTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Age</th>
                <th>Department</th>
                <th>Mark</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="studentTableBody"></tbody>
    </table>
    </div>
    <script src="app.js"></script>
</body>
</html>
